    <!--
      The splash only plays on the very first visit. This tiny script runs
      before first paint and, on repeat visits, marks the document so the
      splash below is never rendered (the self-hosted font is already cached).
    -->
    <script>
      try {
        if (sessionStorage.getItem("splashShown") === "1") {
          document.documentElement.classList.add("splash-skip");
        }
      } catch (e) {}
    </script>

    <!--
      Splash preloader styles - inlined so the splash paints on the very
      first frame (before the JS/CSS bundles load) on the first visit.
    -->
    <style>
      html.splash-skip #preloader {
        display: none !important;
      }

      /* Animatable sweep angle for the conic progress ring below. */
      @property --p {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0deg;
      }

      /* Splash preloader - paints on the very first frame (before the JS
         bundle and the custom font finish downloading) so the hero name is
         never shown in the fallback font on the first cold load. */
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        /* Pin BOTH dimensions to fixed viewport units so the centered icon
           doesn't drift while the fixed containing block settles to its final
           size on the first frames of load (mobile). svh/svw are constants;
           inset:0 / vh / dvh can change mid-load and cause the icon to slide. */
        width: 100vw;
        width: 100svw;
        height: 100vh;
        height: 100svh;
        z-index: 999999;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      /* Exit "boom" - a layered shockwave: a soft light-burst flash, the
         main progress ring ripples outward, and a second echo ring follows,
         while the black backdrop clears to reveal the site underneath. */
      #preloader.preloader--boom {
        background: transparent;
        pointer-events: none;
        transition: background 0.56s ease 0.12s;
      }
      #preloader.preloader--boom .pre-ring {
        animation: pre-boom 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #preloader.preloader--boom .pre-ico {
        animation: pre-ico-out 0.62s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #preloader.preloader--boom .pre-wrap::before {
        animation: pre-flash 0.7s ease-out forwards;
      }
      #preloader.preloader--boom .pre-wrap::after {
        animation: pre-echo 0.84s ease-out 0.14s forwards;
      }
      @keyframes pre-boom {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        16% {
          transform: scale(0.82);
          opacity: 1;
        }
        100% {
          transform: scale(26);
          opacity: 0;
        }
      }
      @keyframes pre-ico-out {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        28% {
          opacity: 1;
          transform: scale(1.14);
        }
        100% {
          opacity: 0;
          transform: scale(1.4);
        }
      }
      @keyframes pre-flash {
        0% {
          opacity: 0;
          transform: scale(0.7);
        }
        25% {
          opacity: 0.8;
          transform: scale(1.5);
        }
        100% {
          opacity: 0;
          transform: scale(9.5);
        }
      }
      @keyframes pre-echo {
        0% {
          opacity: 0.85;
          transform: scale(0.7);
        }
        100% {
          opacity: 0;
          transform: scale(18);
        }
      }
      #preloader .pre-wrap {
        position: relative;
        width: 76px;
        height: 76px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* Burst layers for the boom - invisible during load, animated on exit.
         ::before is a soft radial light flash; ::after is an echo ring. */
      #preloader .pre-wrap::before,
      #preloader .pre-wrap::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
      }
      #preloader .pre-wrap::before {
        background: radial-gradient(
          circle,
          rgba(162, 43, 43, 0.55),
          rgba(162, 43, 43, 0) 70%
        );
      }
      #preloader .pre-wrap::after {
        border: 2px solid #a22b2b;
      }
      /* Circular progress ring - fills once from the top around the icon,
         like a loading indicator. Rendered with a conic-gradient whose sweep
         angle is animated via the @property custom property above. This is
         far lighter to animate than SVG stroke geometry, so it stays smooth
         on mobile during load while keeping the progress-fill look. */
      #preloader .pre-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(
          #a22b2b var(--p, 0deg),
          rgba(162, 43, 43, 0.2) 0
        );
        /* Carve out the middle so only a ~5px ring remains. */
        -webkit-mask: radial-gradient(
          farthest-side,
          #0000 calc(100% - 5px),
          #000 calc(100% - 5px)
        );
        mask: radial-gradient(
          farthest-side,
          #0000 calc(100% - 5px),
          #000 calc(100% - 5px)
        );
        /* --p is driven from JS (real load progress), not a fixed-duration
           animation - see the script below. The transition smooths each step. */
        transition: --p 0.45s ease;
      }
      /* Progress hasn't advanced in a while (slow network) - pulse gently so
         a stall reads as "still working", not "frozen". */
      #preloader .pre-ring--waiting {
        animation: pre-pulse 1.1s ease-in-out infinite;
      }
      @keyframes pre-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      #preloader .pre-ico {
        position: relative;
        z-index: 1;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        /* Prevent the ICO canvas edge from flashing as a square during the
           boom scale/fade animation on some mobile compositors. */
        -webkit-mask-image: radial-gradient(circle, #000 72%, #0000 76%);
        mask-image: radial-gradient(circle, #000 72%, #0000 76%);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Font/app loading splash - removed once the "Hacked" font is ready
         and React has mounted (or after a fail-safe timeout). -->
    <div id="preloader" aria-hidden="true">
      <div class="pre-wrap">
        <div class="pre-ring"></div>
        <img class="pre-ico" src="/coderwings.ico" alt="" width="40" height="40" />
      </div>
    </div>

    <div id="root"></div>
    <script>
      (function () {
        var pre = document.getElementById("preloader");
        var ring = pre ? pre.querySelector(".pre-ring") : null;

        // Let the app know the splash is out of the way so the hero intro
        // (scramble → set name → matrix) starts only once the splash lifts,
        // instead of running hidden behind it.
        function signalSplashDone() {
          if (window.__splashDone) return;
          window.__splashDone = true;
          try {
            window.dispatchEvent(new Event("splash:done"));
          } catch (e) {}
        }

        // Repeat refresh within this tab session: skip splash.
        var alreadyShown = false;
        try {
          alreadyShown = sessionStorage.getItem("splashShown") === "1";
        } catch (e) {}
        if (!pre || alreadyShown) {
          signalSplashDone();
          return;
        }

        // Minimum time the splash stays up on the first visit so it always
        // plays a full, graceful cycle and fades out - never cut abruptly,
        // even when the (now self-hosted) font is ready almost instantly.
        var MIN_VISIBLE = 2400;
        var startedAt = Date.now();

        // --- Ring: driven by real load progress (from src/index.js), not a
        // fixed-duration animation. Creeps toward a capped fraction of the
        // current milestone so it never looks frozen between real signals,
        // and pulses if progress stalls for a while.
        var target = 0.12; // splash itself has started
        var displayed = 0;
        var lastAdvance = Date.now();
        var creepTimer = null;
        function setTarget(v) {
          if (v <= target) return;
          target = v;
          lastAdvance = Date.now();
          if (ring) ring.classList.remove("pre-ring--waiting");
        }
        if (ring) {
          creepTimer = setInterval(function () {
            var cap = 0.88 * target;
            displayed += (cap - displayed) * 0.06;
            ring.style.setProperty("--p", displayed * 360 + "deg");
            if (Date.now() - lastAdvance > 2500) {
              ring.classList.add("pre-ring--waiting");
            }
          }, 100);
        }
        // Pick up progress reported before this listener attached.
        if (typeof window.__appProgressValue === "number") {
          setTarget(window.__appProgressValue);
        }
        window.addEventListener("app:progress", function (e) {
          setTarget(e.detail);
        });

        var hidden = false;
        function hide() {
          if (hidden) return;
          hidden = true;
          try {
            sessionStorage.setItem("splashShown", "1");
          } catch (e) {}
          if (creepTimer) clearInterval(creepTimer);
          if (ring) {
            ring.classList.remove("pre-ring--waiting");
            ring.style.setProperty("--p", "360deg");
          }
          // Ring ripples/booms outward while the backdrop clears; give the
          // boom a beat to breathe, then reveal the hero intro so the site
          // emerges from the ripple instead of cutting in immediately. Also
          // give the final --p transition (0.45s) a moment to actually land
          // before the boom starts, so the ring visibly completes first.
          setTimeout(function () {
            pre.classList.add("preloader--boom");
            setTimeout(signalSplashDone, 360);
            setTimeout(function () {
              if (pre.parentNode) pre.parentNode.removeChild(pre);
            }, 1020);
          }, 260);
        }

        var appReady = false;
        var scheduled = false;
        function maybeHide() {
          if (!appReady || scheduled) return;
          scheduled = true;
          // Hold the splash until BOTH the content is ready AND the minimum
          // display time has elapsed, so the animation completes gracefully.
          var wait = Math.max(0, MIN_VISIBLE - (Date.now() - startedAt));
          setTimeout(hide, wait);
        }

        if (window.__appReady) {
          appReady = true;
        } else {
          window.addEventListener(
            "app:ready",
            function () {
              appReady = true;
              maybeHide();
            },
            { once: true }
          );
        }
        maybeHide();

        // Fail-safe: never trap the user if something stalls.
        setTimeout(hide, 12000);
      })();
    </script>
    <script type="module" src="/src/index.js"></script>
  </body>
